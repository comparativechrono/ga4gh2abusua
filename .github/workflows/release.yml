# Publishes the package to PyPI when a release is published on GitHub.
#
# It uses PyPI's trusted publishing, so no token is stored anywhere: PyPI must
# be told once that this repository's workflow "release.yml", with the
# environment "pypi", may publish the project (on PyPI: the project's
# Settings > Publishing; for a project not yet on PyPI, your account's
# Publishing page, as a "pending publisher").
#
# To release: set the new version in pyproject.toml (and the package's
# __version__), merge, then publish a GitHub release whose tag is the version,
# such as v1.0.0.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check that the tag matches the version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::The release tag ($GITHUB_REF_NAME) does not match the version in pyproject.toml ($version)."
            exit 1
          fi
      - name: Test
        run: |
          python -m pip install ".[test]"
          python -m pytest
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ga4gh2abusua/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
